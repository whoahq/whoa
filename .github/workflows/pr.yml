name: PR

on: [pull_request]

jobs:
  build:
    name: ${{ matrix.build.system_name }} / ${{ matrix.build.build_type }} / ${{ matrix.build.compiler_name }}
    runs-on: ${{ matrix.build.os }}

    strategy:
      fail-fast: false
      matrix:
        build:
          - system_name: Linux
            build_type: Debug
            compiler_name: GCC
            test_path: WhoaTest
            os: ubuntu-latest
            cc: gcc
            cxx: g++

          - system_name: macOS
            build_type: Debug
            compiler_name: Clang
            test_path: WhoaTest
            os: macos-latest
            cc: clang
            cxx: clang++

          - system_name: Windows
            build_type: Debug
            compiler_name: MSVC
            test_path: WhoaTest
            os: windows-latest
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Dependencies (${{ matrix.build.os }})
        run: sudo apt install -y lcov
        if: matrix.build.os == 'ubuntu-latest'

      - name: Download Fixtures
        run: curl -o test/fixture/whoa-fixture.tgz https://whoa.reliquaryhq.com/whoa-fixture.tgz

      - name: Unpack Fixtures
        run: tar -xvzf whoa-fixture.tgz
        working-directory: test/fixture

      - name: Prepare
        run: mkdir build

      - name: Configure
        run: cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build.build_type }}
        working-directory: build

      - name: Build
        run: cmake --build . --config ${{ matrix.build.build_type }}
        working-directory: build

      - name: Install
        run: cmake --install . --config ${{ matrix.build.build_type }}
        working-directory: build

      - name: Test
        run: ../../build/dist/bin/${{ matrix.build.test_path }}
        working-directory: test/fixture
